[package]
name = "rusty-casino"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
easy-api = { version = "0.1.11-rc", features = ["static"] }
rand = "0.10.3"
rusqlite = { version = "0.41.0", features = ["bundled"] }
argon2 = { version = "0.5", features = ["std"] }
password-hash = { version = "0.5", features = ["rand_core"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
